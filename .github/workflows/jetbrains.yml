name: jetbrains-plugin

on:
  push:
    paths:
      - "jetbrains/**"
      - "utils/docs/**"
      - "syntaxes/**"
      - ".github/workflows/jetbrains.yml"
  pull_request:
    paths:
      - "jetbrains/**"
      - "utils/docs/**"
      - "syntaxes/**"
      - ".github/workflows/jetbrains.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew buildPlugin test --stacktrace
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: jetbrains/build/reports/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nastran-jetbrains-plugin
          path: jetbrains/build/distributions/*.zip
